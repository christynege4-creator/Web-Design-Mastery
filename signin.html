<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="signin.css" />
  <link rel="shortcut icon" href="/assets/favicon_io (1)/android-chrome-512x512.png" type="image/x-icon">

  <title>Sign In | Yoga Club</title>
</head>

<body>

  <nav>
    <div class="nav__header">
      <div class="nav__logo">
        <a href="index.html">
          <img src="assets/logo-white.png" class="logo-white" />
          <img src="assets/logo-dark.png" class="logo-dark" />
        </a>
      </div>
      <div class="nav__menu__btn" id="menu-btn">
        <i class="ri-menu-4-line"></i>
      </div>
    </div>

    <ul class="nav__links" id="nav-links">
      <li><a href="index.html">HOME</a></li>
      <li><a href="#">SERVICE</a></li>
      <li><a href="#">PORTFOLIO</a></li>
      <li><a href="#">CONTACT US</a></li>
      <li><a href="signup.html">SIGN UP</a></li>
      <li><a href="#" id="signin-link">SIGN IN</a></li>
      <li><a href="#" id="logout-btn" style="display:none;">LOG OUT</a></li>
    </ul>
  </nav>

  <section class="signin">
    <div class="signin__container">
      <h1>Welcome Back</h1>
      <p>Sign in to continue your yoga journey.</p>

      <form class="signin__form" onsubmit="handleSignin(event)">
        <div class="input__group">
          <label>Email Address</label>
          <input type="email" placeholder="Enter your email" required />
        </div>

        <div class="input__group">
          <label>Password</label>
          <input type="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="signin__btn">Sign In</button>

        <p class="signin__signup">
          Don’t have an account? <a href="signup.html">Sign up</a>
        </p>
      </form>
    </div>
  </section>

  <script src="main.js"></script>


  <script>
    function handleSignin(e) {
      e.preventDefault();
      localStorage.setItem("loggedIn", "true");
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
